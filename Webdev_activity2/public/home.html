<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="../src/css/styles.css">
</head>
<body>
    <h1>Welcome to the TODO List Application</h1>
    <div class="grid-container">
        <table> 
            <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Task Description</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
        </table>
    </div>
    
    <div id="AddTask">
        <h2>Add Task</h2>
        <form id="addTaskForm" method="POST" onsubmit="taskSubmit(event)">
            <div class="form-grp">
                <label for="item_name">Name:</label>
                <input type="text" id="item_name" class="input" name="item_name" placeholder="Final Exam" required>
            </div>
            <div class="form-grp">
                <label for="item_description">Description:</label>
                <input type="text" id="item_description" class="input" name="item_description" placeholder="CIS 1101 Prog 1 Final Exam" required>
            </div>

            <button type="submit" class="btn">Add Task</button>
            <button type="button" id="cancelBtn" class="btn">Cancel</button>
        </form>
    </div>
    <div class="button-options">
        <div class="addNewTaskBtn">
            <button id="addNewTaskBtn" class="btn">Add New Task</button>
        </div>
        <div class="btn-logout">
            <button id="btn-logout" class="btn" onclick="signoutClick(event)">Log Out</button>
        </div>
    </div>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!--script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script-->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script type="text/javascript" src="../src/js/script.js"></script>
</body>
</html>
