<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List Sign Up</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../src/css/styles.css">
    <script type="text/javascript" src="../src/js/script.js"></script>
</head>
<body>
    <div class="signup-form">
        <form id="signup-form" method="post" onsubmit="signupSubmit(event)">
            <h1>Sign Up</h1>
            <p>Please fill in your details to create an account.</p><hr>
            <div class="form-grp">
                <div class="row">
                    <div class="col">
                        <input type="text" id="first_name" class="input" name="first_name" placeholder="First Name" required>
                    </div>
                    <div class="col">
                        <input type="text" id="last_name" class="input" name="last_name" placeholder="Last Name" required>
                    </div>
                </div>
            </div>
            <div class="form-grp">
                <input type="email" id="email" class="input" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-grp">
                <input type="password" id="password" class="input" name="password" placeholder="Password" required>
            </div>
            <div class="form-grp">
                <input type="password" id="confirm_password" class="input" name="confirm_password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <div class="sign-link">
            <p>Already have an account? <a href="index.html">Sign In Here</a></p>
        </div>
    </div>
</body>
</html>
