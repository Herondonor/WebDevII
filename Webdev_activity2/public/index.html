<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List Sign In</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script> 
    <link rel="stylesheet" href="../src/css/styles.css">
    <script type="text/javascript" src="../src/js/script.js"></script>
</head>
<body>
    <div class="signup-form">
        <form id="signin-form" method="get" onsubmit="signinSubmit(event)">
            <h1>Sign In</h1>
            <p>Please fill in your credentials to sign in.</p><hr>
            <div class="form-grp">
                <input type="email" id="email" class="input" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-grp">
                <input type="password" id="password" class="input" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="sign-link">
            <p>Don't have an account? <a href="signup.html">Sign Up Here</a></p>
        </div>
    </div>
</body>
</html>
